decoration:underline;text-underline-offset:3px}.presenting{overflow:hidden;background:#111}.presenting .toolbar,.presenting .slide-tabs,.presenting .below,.presenting .source{display:none}.presenting .workspace{padding:0}.presenting .stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.777778vh);outline:0}.exit{display:none}.presenting .exit{display:block;position:fixed;right:12px;bottom:10px;z-index:10;font:11px Pretendard;background:#fff;color:#20282c;border:1px solid #ccc;padding:6px 10px;border-radius:2px;opacity:.12}.presenting .exit:hover,.presenting .exit:focus-visible{opacity:1}

<header class="toolbar"><a href="index.html#design" aria-label="전체 발표로 돌아가기"><img src="__LOGO__" alt="HIGHST"></a><span class="toolbar-title">주요 슬라이드 · 3장</span><div class="toolbar-actions"><a href="index.html#design">전체 발표 __DECK_COUNT__장</a><a href="index.html#program">웨비나 일정</a><button class="present-button" id="present" type="button">발표 모드</button></div></header>
<main class="workspace"><nav class="slide-tabs" aria-label="주요 슬라이드 선택">__BUTTONS__</nav><div class="stage" aria-label="영어 발표 슬라이드">__SLIDES__</div><div class="below"><p class="note" id="note"></p><div class="paging"><button id="prev" type="button" aria-label="이전 슬라이드">←</button><span id="counter" aria-live="polite"></span><button id="next" type="button" aria-label="다음 슬라이드">→</button></div></div><p class="source">발표자: <a href="https://www.highsturology.co.kr/v2/proud/doctor.php" target="_blank" rel="noopener noreferrer">하이스트 공식 의료진 소개</a></p></main><button id="exit" class="exit" type="button">닫기 · Esc</button>
<script>
const notes=__NOTES__,slides=[...document.querySelectorAll('.study-slide')],buttons=[...document.querySelectorAll('[data-slide]')];let current=0;
function show(index,updateHash=true){current=Math.max(0,Math.min(slides.length-1,Number(index)||0));slides.forEach((s,i)=>{s.hidden=i!==current;if(s.hidden)s.querySelectorAll('video').forEach(video=>video.pause())});buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)));document.getElementById('note').textContent=notes[current];document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / 03';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===2;if(updateHash)history.replaceState(null,'','#'+slides[current].id);}
buttons.forEach((b,i)=>b.onclick=()=>show(i));document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
function exit(){document.body.classList.remove('presenting');document.getElementById('present').focus()}document.getElementById('present').onclick=()=>{document.body.classList.add('presenting');document.getElementById('exit').focus()};document.getElementById('exit').onclick=exit;
document.addEventListener('keydown',e=>{if(e.key==='Escape')exit();if(e.target.closest('video'))return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});window.addEventListener('hashchange',()=>show(slides.findIndex(s=>s.id===location.hash.slice(1)),false));show(slides.findIndex(s=>s.id===location.hash.slice(1)),false);
</script></body></html>
